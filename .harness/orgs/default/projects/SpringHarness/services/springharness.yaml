service:
  name: springharness
  identifier: springharness
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: springharnessmanifest
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: springharness
                  gitFetchType: Branch
                  paths:
                    - <+pipeline.variables.appName>
                  branch: main
              valuesPaths:
                - <+pipeline.variables.appName>/values.yml
              skipResourceVersioning: false
              enableDeclarativeRollback: false
      artifacts:
        primary:
          primaryArtifactRef: <+input>
          sources:
            - spec:
                connectorRef: SpringHarnessDocker
                imagePath: <+pipeline.variables.dockerImage>
                tag: <+pipeline.sequenceId>
                digest: ""
              identifier: springharnessartifact
              type: DockerRegistry
  gitOpsEnabled: false
  orgIdentifier: default
  projectIdentifier: SpringHarness
